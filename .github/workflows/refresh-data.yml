# Rebuilds the site every 6 hours so news headlines and movie lists stay fresh.
# Setup: Cloudflare dashboard > Workers & Pages > eurofilm > Settings > Builds > Deploy Hooks > create one for "main",
# then add its URL as the repository secret CF_DEPLOY_HOOK_URL (GitHub > Settings > Secrets and variables > Actions).
name: Refresh site data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Workers Build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK_URL not set; skipping."; exit 0; fi
          curl -fsS -X POST "$HOOK"
